<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Widget — WidgetWorks</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .form-narrow { max-width: 520px; }
    .danger-zone { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--color-border); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/index.html" class="logo-link"><img src="/img/logo.svg" alt="WidgetWorks"></a>
      <nav>
        <ul class="main-nav">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/catalog.html" class="active">Catalog</a></li>
          <li><a href="/account.html">Account</a></li>
          <li><a href="/contact.html">Contact</a></li>
          <li><a href="/about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container form-narrow">
      <h1>Edit widget</h1>
      <form id="editItemForm">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name">
        </div>
        <div class="form-field">
          <label for="category">Category</label>
          <input type="text" id="category">
        </div>
        <div class="form-field">
          <label for="description">Description</label>
          <textarea id="description" rows="4"></textarea>
        </div>
        <div class="form-field">
          <label for="price">Price (USD)</label>
          <input type="text" id="price">
        </div>
        <div class="form-field">
          <label for="weight">Weight (kg)</label>
          <input type="text" id="weight">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Save changes</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>

      <div class="danger-zone">
        <h3>Remove this widget</h3>
        <p class="text-muted">This item will be archived and can be restored within 30 days.</p>
        <button class="btn btn-danger" id="deleteBtn">Delete widget</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2019 WidgetWorks</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/edit-item.js"></script>
</body>
</html>
