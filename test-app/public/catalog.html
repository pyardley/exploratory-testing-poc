<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog — WidgetWorks</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .toolbar { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-4); flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 220px; padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius); font-family: var(--font-family); font-size: 1rem; }
    .sort-dropdown { position: relative; }
    .sort-trigger { padding: var(--space-2) var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius); background: #fff; cursor: pointer; user-select: none; }
    .sort-menu { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius); min-width: 180px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); z-index: 10; }
    .sort-menu.open { display: block; }
    .sort-menu div { padding: var(--space-2) var(--space-3); cursor: pointer; }
    .sort-menu div:hover { background: var(--color-bg-alt); }
    .product-card img { object-fit: fill; }
    .pagination { display: flex; justify-content: center; align-items: center; gap: var(--space-3); margin-top: var(--space-5); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/index.html" class="logo-link"><img src="/img/logo.svg" alt="WidgetWorks"></a>
      <nav>
        <ul class="main-nav">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/catalog.html" class="active">Catalog</a></li>
          <li><a href="/account.html">Account</a></li>
          <li><a href="/contact.html">Contact</a></li>
          <li><a href="/about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Catalog</h1>

      <div class="toolbar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search widgets…">

        <div class="sort-dropdown" id="sortDropdown">
          <div class="sort-trigger" id="sortTrigger">Sort: Name (A–Z)</div>
          <div class="sort-menu" id="sortMenu">
            <div data-sort="name-asc">Name (A–Z)</div>
            <div data-sort="price-asc">Price: Low to High</div>
            <div data-sort="price-desc">Price: High to Low</div>
          </div>
        </div>

        <a href="#" class="btn btn-secondary" id="downloadCatalogBtn">Download catalog (PDF)</a>
        <a href="/new-item.html" class="btn btn-primary">Add widget</a>
      </div>

      <div class="grid" id="productGrid"></div>

      <div class="pagination">
        <button class="btn btn-secondary" id="prevPageBtn">Previous</button>
        <span id="pageStatus" class="text-muted">Page 1 of 1</span>
        <button class="btn btn-secondary" id="nextPageBtn">Next</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2019 WidgetWorks</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/catalog.js"></script>
</body>
</html>
